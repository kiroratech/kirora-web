name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest code sample that shows the problem.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: '@kirora/web version'
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Browser and version
      placeholder: Chrome 141, Safari 26
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you load the SDK?
      options:
        - npm package
        - Script tag
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework
      placeholder: Next.js 16, React 19, plain HTML
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Any error messages or console output. Remove API keys and tokens.
      render: shell
