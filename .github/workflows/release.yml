name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    # Nothing is published unless every check passes on this commit.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # For npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Opens a "Version packages" PR from the changesets, and publishes once it's merged.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Read by the .npmrc that setup-node writes for registry-url.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
